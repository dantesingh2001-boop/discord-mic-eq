<!DOCTYPE html>
<html>
<head><meta charset="utf-8" /><title>MicEQ plugin harness</title></head>
<body>
<pre id="out">plugin harness</pre>
<script>
  /* Minimal BetterDiscord surface — enough for the plugin to boot headlessly. */
  window.BdApi = {
    Data: { load: function () { return null; }, save: function () {} },
    DOM: {
      addStyle: function (id, css) {
        let s = document.getElementById(id + '-style');
        if (!s) { s = document.createElement('style'); s.id = id + '-style'; document.head.appendChild(s); }
        s.textContent = css;
      },
      removeStyle: function (id) {
        const s = document.getElementById(id + '-style');
        if (s) s.remove();
      },
    },
    UI: { showToast: function () {} },
    Logger: { info: function () {}, warn: function () {}, error: function () {} },
  };
</script>
<script src="../betterdiscord/MicEQ.plugin.js"></script>
<script>
  window.__log = [];
  window.__origGumFn = navigator.mediaDevices.getUserMedia;
  window.__plugin = new window.MicEQPlugin({ name: 'MicEQ' });
  window.__plugin.start();

  window.measure = async function (patch, ms) {
    window.__plugin.applySettings(patch, true);
    await new Promise(function (r) { setTimeout(r, 120); });
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const track = stream.getAudioTracks()[0];
    const ac = new AudioContext();
    await ac.resume();
    const src = ac.createMediaStreamSource(stream);
    const an = ac.createAnalyser();
    an.fftSize = 2048;
    src.connect(an);
    const buf = new Float32Array(an.fftSize);
    let sum = 0, n = 0;
    const t0 = performance.now();
    while (performance.now() - t0 < ms) {
      await new Promise(function (r) { requestAnimationFrame(r); });
      an.getFloatTimeDomainData(buf);
      // skip the first 500 ms: AudioContext resume + gain ramp + loop restart skew RMS
      const warm = performance.now() - t0 < 500;
      if (!warm) for (let i = 0; i < buf.length; i++) { sum += buf[i] * buf[i]; n++; }
    }
    const rms = Math.sqrt(sum / n);
    const info = {
      rms: rms,
      db: 20 * Math.log10(rms || 1e-9),
      label: track.label,
      patched: window.__plugin.patched,
      tracks: stream.getAudioTracks().length,
      settings: track.getSettings ? JSON.stringify(track.getSettings()) : 'none',
    };
    stream.getTracks().forEach(function (t) { t.stop(); });
    await ac.close();
    window.__log.push(info);
    document.getElementById('out').textContent = JSON.stringify(window.__log, null, 1);
    return info;
  };

  document.title = 'MEQ_PLUGIN_READY';
</script>
</body>
</html>
