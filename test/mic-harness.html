<!DOCTYPE html>
<html>
<head><meta charset="utf-8" /><title>MEQ mic harness</title></head>
<body>
<pre id="out">harness ready</pre>
<script>
  window.__log = [];
  window.measure = async function (settings, ms) {
    window.postMessage({ meq: 'settings', settings }, '*');
    await new Promise((r) => setTimeout(r, 120));
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const track = stream.getAudioTracks()[0];
    const ac = new AudioContext();
    await ac.resume();
    const src = ac.createMediaStreamSource(stream);
    const an = ac.createAnalyser();
    an.fftSize = 2048;
    src.connect(an);
    const buf = new Float32Array(an.fftSize);
    let sum = 0, n = 0;
    const t0 = performance.now();
    while (performance.now() - t0 < ms) {
      await new Promise((r) => requestAnimationFrame(r));
      an.getFloatTimeDomainData(buf);
      // skip the first 500 ms: AudioContext resume + gain ramp + loop restart skew RMS
      const warm = performance.now() - t0 < 500;
      if (!warm) for (let i = 0; i < buf.length; i++) { sum += buf[i] * buf[i]; n++; }
    }
    const rms = Math.sqrt(sum / n);
    const info = {
      rms,
      db: 20 * Math.log10(rms || 1e-9),
      label: track.label,
      settings: track.getSettings ? JSON.stringify(track.getSettings()) : 'none',
      canApplyConstraints: typeof track.applyConstraints === 'function',
      sampleRate: ac.sampleRate,
    };
    stream.getTracks().forEach((t) => t.stop());
    await ac.close();
    window.__log.push(info);
    document.getElementById('out').textContent = JSON.stringify(window.__log, null, 1);
    return info;
  };
  document.title = 'MEQ_HARNESS_READY';
</script>
</body>
</html>
