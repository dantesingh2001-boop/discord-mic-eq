<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="title">Mic EQ</div>
    <label class="switch">
      <input type="checkbox" id="enabled" />
      <span class="slider"></span>
    </label>
  </header>

  <div id="status" class="status">checking tab…</div>

  <section class="preamp">
    <div class="row">
      <span class="label">Preamp</span>
      <span id="preampVal" class="value">+6.0 dB</span>
    </div>
    <input type="range" id="preamp" min="-24" max="24" step="0.5" />
    <div class="row boostRow">
      <span class="label">Boost</span>
      <select id="boost"></select>
    </div>
    <div class="loud">total <span id="loudVal">+6.0 dB</span></div>
    <div class="toggles">
      <label><input type="checkbox" id="limiter" /> clip guard</label>
      <label><input type="checkbox" id="softClip" /> soft clip</label>
      <label><input type="checkbox" id="disableBrowserAgc" /> kill browser AGC</label>
      <label><input type="checkbox" id="filterless" /> filterless mic</label>
    </div>
  </section>

  <section class="presets">
    <div class="row">
      <span class="label">Preset</span>
      <select id="preset"></select>
    </div>
  </section>

  <canvas id="graph" width="720" height="300"></canvas>

  <section class="bands" id="bands"></section>

  <footer>
    <button id="addBand" class="ghost">+ band</button>
    <button id="reset" class="ghost">reset</button>
  </footer>

  <script src="dsp.js"></script>
  <script src="popup.js"></script>
</body>
</html>
